[project]
name = "jarvis"
version = "0.1.0"
description = "Local voice-driven desktop assistant for Windows"
requires-python = ">=3.12,<3.13"
dependencies = [
    # --- core / app shell ---
    "pywebview>=5.3",
    "pystray>=0.19.5",
    "pillow>=10.4",
    "pynput>=1.7.7",
    # --- server / transport ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    # --- voice ---
    "sounddevice>=0.5",
    "numpy>=2.0",
    "faster-whisper>=1.1",
    "edge-tts>=6.1",
    "pyttsx3>=2.98",
    # Always-on "hey jarvis" detection. Runs locally on CPU.
    "openwakeword>=0.6.0",
    "onnxruntime>=1.19",
    # --- desktop control ---
    "pyautogui>=0.9.54",
    "pygetwindow>=0.0.9",
    "pywin32>=306",
    "psutil>=6.0",
    "pycaw>=20240210",
    "comtypes>=1.4",
    "pyperclip>=1.9",
    "mss>=9.0",
    # --- utility ---
    "rapidfuzz>=3.10",
    "soundfile>=0.14.0",
    "ddgs>=9.16.0",
    "pywinauto>=0.6.9",
    "uiautomation>=2.0.29",
    # --- Gmail (OAuth, not SMTP/IMAP) ---
    "google-api-python-client>=2.199.0",
    "google-auth-oauthlib>=1.4.1",
    "google-auth-httplib2>=0.4.2",
]

[tool.uv]
package = false
# Jarvis targets Windows only. Constraining the resolver to win32 keeps the
# lock small and avoids Linux-only transitive deps (e.g. tflite-runtime).
environments = ["sys_platform == 'win32'"]
